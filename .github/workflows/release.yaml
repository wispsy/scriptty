name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      use_environment:
        description: 'Whether to use environment pypi'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-with-env:
    if: "${{ github.event.inputs.use_environment != 'false' }}"
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scriptty/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Build distributions
        run: uv build

      - name: Verify distributions
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-without-env:
    if: "${{ github.event.inputs.use_environment == 'false' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Build distributions
        run: uv build

      - name: Verify distributions
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
