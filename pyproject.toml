[project]
name = "scriptty"
version = "0.0.1.dev0"
description = "Passive workflow documents over explicitly selected Python pipelines."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ellainng" }]
dependencies = ["moveset @ git+https://github.com/wispsy/moveset.git@95acbde15881ca9d3ca833c16bc6c93b44687fbc"]

[project.optional-dependencies]
cli = ["expose-interface @ git+https://github.com/wispsy/expose_interface.git@7d7a6f07caf039650a2620ced2e33ecadfdf06a7"]
sequence = ["moveset[sequence] @ git+https://github.com/wispsy/moveset.git@95acbde15881ca9d3ca833c16bc6c93b44687fbc"]
terminal = [
    "carets @ git+https://github.com/wispsy/carets.git@26efdb24dfafea42c45b68dcaff841fc0c2e53d3 ; python_version >= '3.14'",
    "moveset[sequence] @ git+https://github.com/wispsy/moveset.git@95acbde15881ca9d3ca833c16bc6c93b44687fbc",
    "expose-interface @ git+https://github.com/wispsy/expose_interface.git@7d7a6f07caf039650a2620ced2e33ecadfdf06a7",
]

[project.scripts]
scriptty = "scriptty.cli:main"

[project.urls]
Source = "https://github.com/wispsy/scriptty"
Issues = "https://github.com/wispsy/scriptty/issues"
Project = "https://github.com/orgs/wispsy/projects/23"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/*.py", "scripts/*.py", "docs/*.md", "examples/*.json", "examples/*.toml", "cli_tests/**", "terminal_tests/*.py"]
