[project]
name = "scriptty"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Passive workflow documents over explicitly selected Python pipelines."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ellainng" }]
dependencies = ["moveset>=0.1.0"]

[project.optional-dependencies]
cli = ["expose-interface>=0.1.0"]
sequence = ["moveset[sequence]>=0.1.0"]
terminal = [
    "carets>=0.1.0 ; python_version >= '3.14'",
    "moveset[sequence]>=0.1.0",
    "expose-interface>=0.1.0",
]

[project.scripts]
scriptty = "scriptty.cli:main"

[project.urls]
Source = "https://github.com/wispsy/scriptty"
Issues = "https://github.com/wispsy/scriptty/issues"
Project = "https://github.com/orgs/wispsy/projects/23"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["LICENSE", "tests/*.py", "scripts/*.py", "docs/*.md", "examples/*.json", "examples/*.toml", "cli_tests/**", "terminal_tests/*.py"]
